<script>
// ===== Bean Barrage engine: rules, boards, CPU brain. No DOM. =====
const COLS = 6, ROWS = 13; // row 0 is the hidden spawn row, rows 1..12 visible
const EMPTY = -1, JUNK = 5, NCOL = 5;
const CHAIN_POWER = [0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320, 352, 384, 416, 448, 480, 512, 544];
const COLOR_BONUS = [0, 3, 6, 12, 24];
const GROUP_BONUS = n => n <= 4 ? 0 : n >= 11 ? 10 : n - 3;
const MULTI_BONUS = [0, 0, 6, 12, 24, 48, 64]; // popping 2+ separate groups in one step
// Junk sent per pop step. Every pop sends something; small pops stay small, long chains get brutal.
// About 60% of the classic score/70 rate, but a lone pop still sends 1.
// 1 pop: 1 | 2-chain: 4 total | 3-chain: 9 | 4-chain: 19 (3 rows) | 5-chain: 39 | 6-chain: 69 | 7-chain: 109
const JUNK_STEP = [0, 1, 3, 5, 10, 20, 30, 40, 50];
function junkFor(pop, chain) {
  let n = JUNK_STEP[Math.min(chain, JUNK_STEP.length - 1)];
  let extra = 0; for (const g of pop.groups) extra += Math.max(0, g - 4);
  n += Math.floor(extra / 2);                       // bigger groups: +1 per 2 extra beans
  n += 2 * Math.max(0, pop.groups.length - 1);      // popping several groups at once: +2 each
  return n;
}
const ROT = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // satellite offset per rotation
const JUNK_RATE = 70;

function rng(seed) { // mulberry32
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function newGrid() { const g = []; for (let y = 0; y < ROWS; y++) { g.push(new Array(COLS).fill(EMPTY)); } return g; }
function cloneGrid(g) { return g.map(r => r.slice()); }

// compact columns downward; returns list of moves {x, from, to}
function applyGravity(g) {
  const moves = [];
  for (let x = 0; x < COLS; x++) {
    let w = ROWS - 1;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (g[y][x] !== EMPTY) {
        if (y !== w) { g[w][x] = g[y][x]; g[y][x] = EMPTY; moves.push({ x, from: y, to: w }); }
        w--;
      }
    }
  }
  return moves;
}

// find groups of >=4 among visible rows; returns {cells:Set(idx), groups:[size], colors:Set}
function findPops(g) {
  const seen = new Uint8Array(ROWS * COLS);
  const cells = []; const groups = []; const colors = new Set();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = g[y][x]; const i = y * COLS + x;
    if (c < 0 || c >= NCOL || seen[i]) continue;
    const stack = [i]; const grp = []; seen[i] = 1;
    while (stack.length) {
      const j = stack.pop(); grp.push(j);
      const jy = (j / COLS) | 0, jx = j % COLS;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = jx + dx, ny = jy + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        const k = ny * COLS + nx;
        if (!seen[k] && g[ny][nx] === c) { seen[k] = 1; stack.push(k); }
      }
    }
    if (grp.length >= 4) { cells.push(...grp); groups.push(grp.length); colors.add(c); }
  }
  if (!cells.length) return null;
  // junk next to popping beans goes too
  const set = new Set(cells); const junk = [];
  for (const j of cells) {
    const jy = (j / COLS) | 0, jx = j % COLS;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = jx + dx, ny = jy + dy;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      const k = ny * COLS + nx;
      if (g[ny][nx] === JUNK && !set.has(k)) { set.add(k); junk.push(k); }
    }
  }
  return { cells: set, beans: cells.length, groups, colors: colors.size, junk };
}

function stepScore(pop, chain) {
  let mult = CHAIN_POWER[Math.min(chain - 1, CHAIN_POWER.length - 1)] + COLOR_BONUS[pop.colors - 1];
  for (const n of pop.groups) mult += GROUP_BONUS(n);
  mult += MULTI_BONUS[Math.min(pop.groups.length, MULTI_BONUS.length - 1)];
  mult = Math.max(1, Math.min(999, mult));
  return { base: 10 * pop.beans, mult, pts: 10 * pop.beans * mult };
}

// full resolve on a grid copy (for the AI); returns {score, chains}
function simulateResolve(g) {
  let chain = 0, score = 0, beans = 0, multi = 0, biggest = 0, junk = 0;
  applyGravity(g);
  for (;;) {
    const p = findPops(g); if (!p) break;
    chain++; score += stepScore(p, chain).pts; beans += p.beans; junk += junkFor(p, chain);
    multi = Math.max(multi, p.groups.length); biggest = Math.max(biggest, ...p.groups);
    for (const i of p.cells) g[(i / COLS) | 0][i % COLS] = EMPTY;
    applyGravity(g);
  }
  return { score, chains: chain, beans, multi, biggest, junk };
}

function colHeight(g, x) { for (let y = 0; y < ROWS; y++) if (g[y][x] !== EMPTY) return ROWS - y; return 0; }

// ---------------- Board ----------------
class Board {
  constructor(side, seed, opts = {}) {
    this.side = side;
    this.grid = newGrid();
    this.rand = rng(seed);           // shared-seed sequence so both players get the same pairs
    this.junkRand = rng(seed * 31 + 7 + side * 1013); // junk scatter never touches the pair sequence
    this.queue = [];
    this.score = 0;
    this.pending = 0;                // junk waiting to fall on me
    this.junkAcc = 0;                // score not yet converted to junk
    this.state = 'spawn';
    this.timer = 0;
    this.piece = null;
    this.chain = 0;
    this.maxChain = 0;
    this.popping = null;
    this.anim = new Map();           // idx -> pixel offset (negative = above)
    this.vel = new Map();
    this.slow = new Set();           // junk falls lazily
    this.squash = new Map();         // idx -> frames left
    this.lost = false;
    this.speed = opts.speed || 0.02; // cells per frame
    this.events = [];                // for UI/audio: {t:'pop',chain,...}
    this.opponent = null;
    this.lockFrames = 0; this.lockResets = 0;
    this.softDrop = false;
    this.lastRotFail = -99; this.frame = 0;
    this.chainText = null;
    this.pairsUsed = 0;
    this.colors = opts.colors || 5;
  }
  nextPair() {
    while (this.queue.length < 3) {
      const r = this.rand; const n = this.colors;
      this.queue.push([Math.floor(r() * n), Math.floor(r() * n)]);
    }
    return this.queue.shift();
  }

function placements() {

function aiChoose(board, st, rnd) {

  const first = [];

    if (!reachable(g0, pl)) continue;
    const g = cloneGrid(g0);
    if (!placeOn(g, pl, a, b)) continue;
    const res = simulateResolve(g);
    const v = evalGrid(g, res, st, ctx, pl);

      let b2 = -1e12;
      const ctx2 = { pending: Math.max(0, ctx.pending - f.res.junk), oppHigh: ctx.oppHigh };

class CPU {
  constructor(board, level, seed) { this.b = board; this.lv = AI_LEVELS(level); this.rnd = rng(seed); this.plan = null; this.wait = 0; this.lastPairs = -1; }
  update() {

    b.softDrop = false;
    if (b.state !== 'fall' || !b.piece) { this.plan = null; return; }
    if (this.lastPairs !== b.pairsUsed) { this.lastPairs = b.pairsUsed; this.plan = aiChoose(b, this.lv, this.rnd); this.wait = this.lv.think; }
    if (this.wait-- > 0) return;

      if (!b.rotate(d)) { b.lastRotFail = -99; if (!b.rotate(-d)) { b.lastRotFail = -99; this.plan = { x: p.x, rot: p.rot }; } }

function shout(word, side) {

  if (SND.voicePack[word]) { const s = SND.ac.createBufferSource(); s.buffer = SND.voicePack[word]; s.playbackRate.value = side ? 0.85 : 1; s.connect(SND.sfxBus); s.start(); return; }

    if (VOWEL[ph]) {
      const F = VOWEL[ph];
      bands.forEach((b, i) => b.frequency.linearRampToValueAtTime(F[i] * (side ? 0.9 : 1.08), t + 0.025));
      src.frequency.linearRampToValueAtTime(base * p0, t + 0.02);

    }

  }

}

const CALLS = ['', '', 'NICE!', 'YIPPEE!', 'YEEHAW!', 'WHOOPEE!', 'BEANTASTIC!', 'BEAN MANIA!'];

// ---------- input ----------
const keys = {}, pressed = {};
const BIND = {
  p1: { left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], down: ['ArrowDown', 'KeyS'], cw: ['KeyX', 'ArrowUp', 'KeyK', 'KeyW'], ccw: ['KeyZ', 'KeyJ'] },

// ---------- persistence ----------
const SAVE = (() => { try { return JSON.parse(localStorage.getItem('beanbarrage') || '{}'); } catch (e) { return {}; } })();

// ---------- game state ----------
const G = { scene: 'title', t: 0, menu: 0, mode: 'story', stage: 0, sel: 0, totalScore: 0, wins: [0, 0] };
let M = null; // current match

function startMatch(oppIndex, mode) {
  const seed = (Math.random() * 1e9) | 0;
  const lvl = mode === '2p' ? 0 : oppIndex;
  const colors = 5;
  const a = new Board(0, seed, { colors }), b = new Board(1, seed, { colors });
  a.opponent = b; b.opponent = a;
  M = {
    a, b, opp: CAST[oppIndex], oppIndex, mode, frame: 0, mood: 'n', moodT: 0, over: false, overT: 0, winner: 0, paused: false,
    ca: mode === '2p' ? new Human(a, BIND.p1v) : new Human(a, BIND.p1),
    cb: mode === '2p' ? new Human(b, BIND.p2v) : new CPU(b, lvl, seed + 7),
    base: mode === '2p' ? 0.024 : 0.022 + oppIndex * 0.0036, shake: 0, flash: [],
    startScore: G.totalScore, bgIndex: (Math.random() * 15) | 0,

function setMood(m, t) { if (!M) return; M.mood = m; M.moodT = t; }

function updateMatch() {
  if (M.paused) { if (hit(['Escape', 'KeyP', 'Enter'])) M.paused = false; return; }
  if (hit(['Escape', 'KeyP'])) { M.paused = true; return; }
  M.frame++;
  const sp = Math.min(0.16, M.base + M.frame / 3600 * 0.012);
  M.a.speed = M.b.speed = sp;
  if (!M.over) { M.ca.update(); M.cb.update(); }
  M.a.update(); M.b.update();
  for (const [bd, side] of [[M.a, 0], [M.b, 1]]) {
    for (const e of bd.events) {
      if (e.t === 'move' && side === 0) SFX.move();
      if (e.t === 'rot' && side === 0) SFX.rot();
      if (e.t === 'land' && side === 0) SFX.land();
      if (e.t === 'pop') {
        SFX.pop(e.chain);
        if (e.chain >= 2) M.shake = Math.min(10, 2 + e.chain * 1.5);
        if (side === 0 && (e.chain >= 2 || e.groups >= 2)) { setMood('s', 70); M.you = { mood: 'g', t: 80 }; }
        if (e.chain >= 2) say(CALLS[Math.min(e.chain, CALLS.length - 1)], side);
        else if (e.groups >= 2) say(COMBOS[Math.min(e.groups, COMBOS.length - 1)], side);
      }
      if (e.t === 'send') { SFX.send(); if (side === 1) setMood('g', 100); }
      if (e.t === 'junk') { SFX.junk(); M.shake = 6; if (side === 1) setMood('s', 110); else { setMood('g', 110); M.you = { mood: 's', t: 80 }; } }
      if (e.t === 'lose' && !M.over) { M.over = true; M.winner = side === 0 ? 2 : 1; M.overT = 0; }
    }
    bd.events.length = 0;
  }
  SND.tempoMul = !M.over && M.a.maxHeight() >= 10 ? 1.12 : 1;
  if (M.moodT > 0) M.moodT--; else M.mood = M.b.maxHeight() >= 10 ? 's' : M.a.maxHeight() >= 10 ? 'g' : 'n';
  if (M.shake > 0) M.shake *= 0.85;
  if (M.over) {
    M.overT++;
    const loser = M.winner === 1 ? M.b : M.a; const winner = M.winner === 1 ? M.a : M.b;
    if (M.overT === 1) { winner.state = 'won'; loser.state = 'dead'; (M.winner === 1 || M.mode === '2p') ? SFX.win() : SFX.lose(); M.mood = M.winner === 1 ? 's' : 'g'; }

function finishMatch() {
  SFX.select();
  if (M.mode === 'story') {
    if (M.winner === 1) {
      const timeBonus = Math.max(0, 6000 - Math.floor(M.frame / 60) * 20) + M.a.maxChain * 1000;
      G.totalScore = M.a.score + timeBonus;
      SAVE.beaten = [...new Set([...(SAVE.beaten || []), CAST[G.stage].id])];
      G.stage++;
      SAVE.best = Math.max(SAVE.best || 0, G.stage); SAVE.hi = Math.max(SAVE.hi || 0, G.totalScore); save();
      if (G.stage >= CAST.length) playCutscene(ENDING, 14, () => { G.scene = 'ending'; G.t = 0; music('ending'); });
      else playCutscene(stageBeats(G.stage), G.stage, () => { G.scene = 'intro'; G.t = 0; });
